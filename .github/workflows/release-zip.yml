name: Build Chrome extension zip

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify extension files exist
        run: |
          test -f manifest.json
          test -f content.js
          test -f dark.css

      - name: Create store-ready ZIP (root contents)
        run: |
          ZIP_NAME="finn-darkmode-${GITHUB_REF_NAME}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x "LICENSE" \
            -x "*__MACOSX*" \
            -x "*.DS_Store"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: finn-darkmode-${{ github.ref_name }}
          path: finn-darkmode-${{ github.ref_name }}.zip

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: finn-darkmode-${{ github.ref_name }}.zip
