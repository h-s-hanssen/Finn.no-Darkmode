name: Build Chrome extension zip

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest exists
        run: test -f manifest.json

      - name: Create store-ready ZIP (root contents)
        run: |
          ZIP_NAME="finn-darkmode-${{ github.event.release.tag_name }}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x "LICENSE" \
            -x "*__MACOSX*" \
            -x "*.DS_Store"

      - name: Attach ZIP to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: finn-darkmode-${{ github.event.release.tag_name }}.zip
